<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>RCR Verification · Admin</title>
<style>
:root { font: 14px/1.45 -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif; color: #171717; background: #f5f5f5; }
body { margin: 0; }
header { background: #171717; color: #fff; padding: 12px 20px; display: flex; gap: 16px; align-items: center; }
header a { color: #d9d9d9; font-size: 12px; }
header h1 { font-size: 16px; margin: 0; }
main { max-width: 1250px; margin: 0 auto; padding: 16px 20px 40px; }
section { background: #fff; border: 1px solid #d9d9d9; border-radius: 8px; padding: 12px 14px; margin-bottom: 14px; }
h2 { font-size: 12px; letter-spacing: .07em; color: #525252; margin: 0 0 8px; }
table { border-collapse: collapse; width: 100%; font-variant-numeric: tabular-nums; }
th, td { border-bottom: 1px solid #ececec; padding: 4px 8px; text-align: right; white-space: nowrap; }
th:first-child, td:first-child { text-align: left; }
th { font-size: 12px; color: #525252; }
button { font: inherit; border: 1px solid #171717; background: #171717; color: #fff; border-radius: 6px; padding: 7px 12px; cursor: pointer; }
button.secondary { background: #fff; color: #171717; border-color: #cfcfcf; }
button:disabled { opacity: .45; cursor: default; }
.badge { font-size: 11px; font-weight: 700; border-radius: 999px; padding: 3px 8px; border: 1px solid #d4d4d4; }
.badge.complete { color: #1f7a36; border-color: #b9d9c1; background: #f5fbf6; }
.badge.partial { color: #a16207; border-color: #e5cf9a; background: #fffaf0; }
.muted { color: #6b7280; }
.error { color: #b42318; white-space: pre-wrap; }
.warn { color: #a16207; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; margin-bottom: 8px; }
.scroll { overflow-x: auto; }
</style>
</head>
<body>
<header><h1>Full Positive Verification · Administrator</h1><a href="/">Home</a></header>
<main>
  <section>
    <div class="row">
      <span id="status" class="badge partial">Loading…</span>
      <span id="exportInfo" class="muted"></span>
      <span style="flex:1"></span>
      <button id="refresh" class="secondary">Refresh</button>
      <button id="export" disabled>Generate final result &amp; statistics</button>
    </div>
    <div class="muted">Final majority voting and the statistics export are blocked until all 3 annotators have a valid record for every Validation/Test query. Figures below use only queries with all 3 valid records (partial until then).</div>
    <div id="message" class="error" role="alert"></div>
  </section>
  <div id="content"></div>
</main>
<script>
const $ = id => document.getElementById(id);
const fmt = (v, digits = 3) => v === null || v === undefined ? "—" : (Number.isInteger(v) ? String(v) : v.toFixed(digits));
const pct = v => v === null || v === undefined ? "—" : v.toFixed(1) + "%";
const frac = v => v === null || v === undefined ? "—" : (100 * v).toFixed(1) + "%";

function table(title, header, rows) {
  const section = document.createElement("section");
  const h = document.createElement("h2"); h.textContent = title; section.append(h);
  const wrap = document.createElement("div"); wrap.className = "scroll";
  const t = document.createElement("table");
  const head = t.insertRow();
  for (const text of header) { const th = document.createElement("th"); th.textContent = text; head.append(th); }
  for (const row of rows) {
    const tr = t.insertRow();
    for (const cell of row) tr.insertCell().textContent = cell;
  }
  wrap.append(t); section.append(wrap);
  return section;
}

function label(g) { return g.query_type === "ALL" ? (g.split === "overall" ? "Overall (val+test)" : g.split) : `${g.split} · ${g.query_type}`; }

function render(data) {
  const badge = $("status");
  badge.textContent = data.status === "complete" ? "All annotations complete" : "Partial — not finalizable";
  badge.className = `badge ${data.status}`;
  $("export").disabled = data.status !== "complete";
  const e = data.last_export;
  $("exportInfo").textContent = !e.exists ? "No export yet" :
    `Last export: ${e.generated_at || "?"} · ${e.up_to_date ? "up to date" : "STALE (annotations changed since)"}`;
  const groups = data.groups, content = $("content");
  content.replaceChildren();
  const overall = groups[0];
  const c = overall.coverage;
  content.append(table("PROGRESS (completed / total queries)", ["Group", "Queries", "Pairs", "A1", "A2", "A3", "All 3 valid", "Invalid records"],
    groups.filter(g => g.query_type === "ALL").map(g => [label(g), g.coverage.queries, g.coverage.candidate_pairs,
      ...["A1", "A2", "A3"].map(n => `${g.coverage.annotators[n].completed_queries} (${pct(g.coverage.annotators[n].completion_pct)})`),
      g.coverage.queries_all_three_valid, g.coverage.invalid_records_total])));
  content.append(table("AGREEMENT", ["Group", "Pairs", "3-way %", "A1–A2 %", "A1–A3 %", "A2–A3 %", "κ A1–A2", "κ A1–A3", "κ A2–A3", "Mean κ", "Fleiss κ"],
    groups.map(g => { const a = g.agreement, p = a.pairwise, k = a.cohen_kappa; return [label(g), a.evaluated_pairs, pct(a.agreement_3way_pct),
      pct(p.A1_A2.agreement_pct), pct(p.A1_A3.agreement_pct), pct(p.A2_A3.agreement_pct),
      fmt(k.A1_A2.kappa), fmt(k.A1_A3.kappa), fmt(k.A2_A3.kappa), fmt(a.mean_cohen_kappa.value), fmt(a.fleiss_kappa.value)]; })));
  content.append(table("MAJORITY VOTING", ["Group", "3/3 pos", "2/3 pos", "2/3 neg", "3/3 neg", "Unanimous", "Non-unanimous", "Final pos 3/3", "Final pos 2/3"],
    groups.map(g => { const v = g.voting; return [label(g), v.unanimous_positive_3of3, v.majority_positive_2of3, v.majority_negative_2of3,
      v.unanimous_negative_3of3, frac(v.unanimous_agreement_rate), frac(v.non_unanimous_majority_rate), pct(v.final_positives_3of3_pct), pct(v.final_positives_2of3_pct)]; })));
  content.append(table("ORIGINAL (A1) POSITIVE VERIFICATION", ["Group", "Original links", "Retained", "Removed", "Added", "Confirmation", "Rejection", "Net change", "Queries changed", "Seeds rejected"],
    groups.map(g => { const o = g.original_verification; return [label(g), o.original_positive_links, o.retained, o.removed, o.new_positives_added,
      frac(o.confirmation_rate), frac(o.rejection_rate), o.net_positive_change, o.queries_changed, o.original_seeds_rejected]; })));
  content.append(table("POSITIVES PER QUERY (overall: A1 / A2 / A3 / Final)", ["Output", "Total links", "Mean", "Median", "Std", "Min", "Max", "0 positives", "1 positive", ">1 positive", "% multiple"],
    ["A1", "A2", "A3", "final"].map(n => { const d = overall.positive_distribution[n]; return [n === "final" ? "Final" : n, d.total_positive_links, fmt(d.mean), fmt(d.median), fmt(d.std),
      fmt(d.min), fmt(d.max), d.queries_with_0, d.queries_with_1, d.queries_with_more_than_1, pct(d.queries_with_multiple_pct)]; })));
  const diag = data.diagnostics, section = document.createElement("section");
  const h = document.createElement("h2"); h.textContent = "DIAGNOSTICS"; section.append(h);
  const lines = [
    `Queries with 0 final positives: ${overall.diagnostics.final_zero_positive_queries}`,
    `Original seeds rejected by the final majority: ${overall.original_verification.original_seeds_rejected} (downstream RCR validation requires the seed as a positive)`,
    `Invalid/unknown records: ${diag.error_count} · Train records ignored per annotator: ${Object.entries(diag.excluded_non_verification_records).map(([k, v]) => `${k} ${v}`).join(", ")}`,
    `Annotation files: ${Object.entries(data.files).map(([k, f]) => `${k} ${f.exists ? f.records + " records" : "MISSING"}`).join(" · ")}`,
    `Final file: data/verification/${data.final_file}`,
  ];
  for (const text of lines) { const p = document.createElement("div"); p.textContent = text; section.append(p); }
  for (const err of diag.errors) { const p = document.createElement("div"); p.className = "warn"; p.textContent = `${err.annotator} ${err.sample_id ?? ""}: ${err.reason}`; section.append(p); }
  content.append(section);
}

async function request(url, options) {
  const response = await fetch(url, options);
  let body;
  try { body = await response.json(); } catch { throw new Error(`HTTP ${response.status}`); }
  if (!response.ok) throw new Error(body.error || `HTTP ${response.status}`);
  return body;
}

async function load(keepMessage = false) {
  if (!keepMessage) $("message").textContent = "";
  try { render(await request("/verify/api/admin/stats")); }
  catch (error) { $("message").textContent = error.message; $("status").textContent = "Error"; }
}

$("refresh").onclick = () => load();
$("export").onclick = async () => {
  if (!confirm("Generate positive_sets_final.jsonl and data/verification/statistics/ from the current annotations? Existing exports are replaced.")) return;
  $("export").disabled = true;
  let text, cls = "muted";
  try {
    const result = await request("/verify/api/admin/export", { method: "POST", headers: { "Content-Type": "application/json" }, body: "{}" });
    text = `Exported ${result.final_file} and ${result.statistics_dir}/.`;
  } catch (error) { text = error.message; cls = "error"; }
  await load();
  $("message").className = cls;
  $("message").textContent = text;
};
load();
</script>
</body>
</html>
